info:
  name: 04 - Crear usuario de prueba
  type: http
  seq: 4
http:
  method: POST
  url: 'http://localhost:8080/api/admin/usuarios'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "nombre": "Usuario de prueba Bruno",
        "email": "bruno.usuario.admin.prueba@ejemplo.com",
        "password": "Prueba2026!",
        "telefono": "+529511234567",
        "rol": "VOTANTE"
      }
  auth:
    type: bearer
    token: PEGA_AQUI_TOKEN_ADMIN
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Crea un usuario VOTANTE de prueba. Si el correo ya existe, cambialo manualmente en Body. Copia el idUsuario devuelto (se usara manualmente en las peticiones 05, 06, 07, 11 y 13).
