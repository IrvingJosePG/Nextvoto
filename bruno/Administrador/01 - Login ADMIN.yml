http:
  method: POST
  url: 'http://localhost:8080/api/auth/login'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@nextvoto.com",
        "password": "NextVoto2026!"
