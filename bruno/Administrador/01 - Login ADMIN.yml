docs: |-
  Inicia sesion como ADMIN con POST. Copia manualmente el JWT del campo token de la respuesta. Pegalo en Auth -> Bearer Token de las peticiones ADMIN que quieras ejecutar. Si vence, inicia sesion otra vez. No guardes tokens reales en GitHub.
