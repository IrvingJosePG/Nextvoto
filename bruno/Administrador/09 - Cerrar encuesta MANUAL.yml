info:
  name: 09 - Cerrar encuesta MANUAL
  type: http
  seq: 9
http:
  method: PATCH
  url: 'http://localhost:8080/api/admin/encuestas/{{idEncuestaPrueba}}/cerrar'
  auth:
    type: bearer
    token: '{{tokenAdmin}}'
runtime:
  scripts:
  - type: before-request
    code: |-
      const id = Number(bru.getVar('idEncuestaPrueba'));
      if (!Number.isSafeInteger(id) || id <= 0) {
        throw new Error('Primero configura idEncuestaPrueba con el ID de una encuesta descartable.');
      }
  - type: tests
    code: |-
      test("HTTP 204", function () {
        expect(res.getStatus()).to.equal(204);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  PELIGRO: cambia activa=false en una encuesta real. No envíes esta petición sin configurar idEncuestaPrueba con una encuesta desechable. Usa exclusivamente una encuesta temporal y respalda la BD antes de probar. Si no se proporciona un ID válido, el script detiene la petición. No existe endpoint para reabrir.
