info:
  name: 09 - Cerrar encuesta MANUAL
  type: http
  seq: 9
http:
  method: PATCH
  url: 'http://localhost:8080/api/admin/encuestas/REEMPLAZAR_ID_ENCUESTA_PRUEBA/cerrar'
  auth:
    type: bearer
    token: PEGA_AQUI_TOKEN_ADMIN
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  ADVERTENCIA: cierra una encuesta. Reemplaza REEMPLAZAR_ID_ENCUESTA_PRUEBA con el ID de una encuesta DESCARTABLE, no con datos importantes. Requiere JWT ADMIN valido.
