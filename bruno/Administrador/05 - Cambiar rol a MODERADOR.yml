info:
  name: 05 - Cambiar rol a MODERADOR
  type: http
  seq: 5
http:
  method: PATCH
  url: 'http://localhost:8080/api/admin/usuarios/REEMPLAZAR_ID_USUARIO_PRUEBA/rol'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "rol": "MODERADOR"
      }
  auth:
    type: bearer
    token: PEGA_AQUI_TOKEN_ADMIN
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Reemplaza REEMPLAZAR_ID_USUARIO_PRUEBA en la URL por el idUsuario del usuario que acabas de crear. Requiere JWT ADMIN valido. Cambia el rol a MODERADOR.
