info:
  name: 06 - Desactivar usuario
  type: http
  seq: 6
http:
  method: PATCH
  url: 'http://localhost:8080/api/admin/usuarios/REEMPLAZAR_ID_USUARIO_PRUEBA/estado'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "activo": false
      }
  auth:
    type: bearer
    token: PEGA_AQUI_TOKEN_ADMIN
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Reemplaza el ID en la URL por el de tu usuario de prueba. Requiere JWT ADMIN valido. Desactiva esa cuenta de prueba.
