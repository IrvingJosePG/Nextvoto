info:
  name: 11 - Rol invalido devuelve 422
  type: http
  seq: 11
http:
  method: PATCH
  url: 'http://localhost:8080/api/admin/usuarios/REEMPLAZAR_ID_USUARIO_PRUEBA/rol'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "rol": "ADMIN"
      }
  auth:
    type: bearer
    token: PEGA_AQUI_TOKEN_ADMIN
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Prueba negativa: reemplaza el ID con el de un usuario de prueba ya creado. El ADMIN no puede asignar rol ADMIN desde este endpoint. Se espera HTTP 422.
