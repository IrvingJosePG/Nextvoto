info:
  name: 15 - Login VOTANTE
  type: http
  seq: 15
http:
  method: POST
  url: 'http://localhost:8080/api/auth/login'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "email": "miguel@nextvoto.com",
        "password": "NextVoto2026!"
      }
  auth:
    type: none
runtime:
  scripts:
  - type: after-response
    code: |-
      if (res.getStatus() === 200) {
        const d = res.getBody();
        if (d && d.token && d.rol === 'VOTANTE') bru.setVar('tokenVotante', d.token);
      }
  - type: tests
    code: |-
      test("HTTP 200", function () {
        expect(res.getStatus()).to.equal(200);
      });
      test("Rol VOTANTE", function () {
        expect(res.getBody().rol).to.equal('VOTANTE');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  Guarda un JWT de VOTANTE en memoria para verificar que no pueda acceder a la API ADMIN.
