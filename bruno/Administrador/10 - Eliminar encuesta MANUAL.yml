info:
  name: 10 - Eliminar encuesta MANUAL
  type: http
  seq: 10
http:
  method: DELETE
  url: 'http://localhost:8080/api/admin/encuestas/REEMPLAZAR_ID_ENCUESTA_PRUEBA'
  auth:
    type: bearer
    token: PEGA_AQUI_TOKEN_ADMIN
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  ADVERTENCIA: elimina una encuesta y sus datos asociados. Reemplaza REEMPLAZAR_ID_ENCUESTA_PRUEBA con el ID de una encuesta DESCARTABLE. Requiere JWT ADMIN valido.
