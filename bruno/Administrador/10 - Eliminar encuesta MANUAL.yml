info:
  name: 10 - Eliminar encuesta MANUAL
  type: http
  seq: 10
http:
  method: DELETE
  url: '{{baseUrl}}/api/admin/encuestas/{{idEncuestaPrueba}}'
  auth:
    type: bearer
    token: '{{tokenAdmin}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 204", function () {
        expect(res.getStatus()).to.equal(204);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: |-
  PELIGRO: elimina la encuesta y puede eliminar sus preguntas, opciones, participaciones y respuestas por cascada. NO ejecutar en la base con datos importantes. idEncuestaPrueba=0 por defecto; usar únicamente registro temporal de prueba.
